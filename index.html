<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My tasks</h1>
    <p id="count" class="count"></p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks here. Add one above to get started.</p>

    <button id="clear-done" class="link">Clear completed</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
